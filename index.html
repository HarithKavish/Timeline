<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The shared design system's foundations. Timeline's own tokens sit on
         top and only add what the system does not define. -->
    <link rel="stylesheet" href="https://harithkavish.com/design-system/v1.0.0/tokens.css?v=20260829.3" />
    <link rel="stylesheet" href="https://harithkavish.com/design-system/v1.0.0/base.css?v=20260829.3" />
    <title>Timeline — a chronological catalogue of creative works</title>
    <meta
      name="description"
      content="Timeline is a source-backed chronological catalogue of creative works and their creators. What, who, when, how they relate, and where each fact came from. First domain: Tamil music."
    />
    <meta name="theme-color" content="#f4f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1014" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Timeline — a chronological catalogue of creative works" />
    <meta
      property="og:description"
      content="Works, creators, releases and provenance, arranged by when things happened. Stage 1 runs on a demonstration dataset."
    />
    <meta property="og:url" content="https://timeline.harithkavish.com/" />
    <meta name="twitter:card" content="summary" />

    <!-- The ecosystem's shared state, so a theme chosen on another
         harithkavish.com surface is already the theme here. -->
    <script src="https://harithkavish.com/design-system/v1.0.0/harith-store.js?v=20260829.3"></script>

    <script>
      // Apply the stored theme before first paint so the page never flashes the
      // wrong palette. Mirrors the logic in src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = window.HarithStore
            ? window.HarithStore.get('theme')
            : localStorage.getItem('timeline.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (error) {
          /* storage unavailable — fall back to the system preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
