<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Timeline — a chronological catalogue of creative works</title>
    <meta
      name="description"
      content="Timeline is a source-backed chronological catalogue of creative works and their creators. What, who, when, how they relate, and where each fact came from. First domain: Tamil music."
    />
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Timeline — a chronological catalogue of creative works" />
    <meta
      property="og:description"
      content="Works, creators, releases and provenance, arranged by when things happened. Stage 1 runs on a demonstration dataset."
    />
    <meta property="og:url" content="https://timeline.harithkavish.com/" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the stored theme before first paint so the page never flashes the
      // wrong palette. Mirrors the logic in src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('timeline.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (error) {
          /* storage unavailable — fall back to the system preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
