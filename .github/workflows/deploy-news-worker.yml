name: Deploy news Worker

# The timeline-news Worker (workers/news) deploys from main through this workflow, not by hand,
# so what is live is always a commit on main and the run log says which one. A pull request
# that touches the Worker gets a type-check and a dry-run build instead, so a bundle that will
# not build is caught before it reaches main.
#
# D1 migrations are not applied here: the deploy token can publish Workers but cannot change
# the database. Apply a new migration (workers/news/migrations) before merging code that needs it.
on:
  push:
    branches: [main]
    paths:
      - "workers/news/**"
      - ".github/workflows/deploy-news-worker.yml"
  pull_request:
    paths:
      - "workers/news/**"
      - ".github/workflows/deploy-news-worker.yml"
  # Re-deploys the current main without a new commit.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer run waits rather than racing an older one.
concurrency:
  group: deploy-news-worker-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/news
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - name: Build the bundle without deploying it
        run: npx --yes wrangler@4.160.1 deploy --dry-run --outdir dist

  deploy:
    # Only main is production. A manual run from any other branch does nothing, so an unmerged
    # branch can never end up serving the news API.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/news
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e336e9fbd3e20dbb26269765f036e9b8
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is not set, so there is nothing to deploy with."
            exit 1
          fi
          npx --yes wrangler@4.160.1 deploy
