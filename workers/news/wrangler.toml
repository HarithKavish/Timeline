name = "timeline-news"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Ingestion cadence. Cloudflare's free plan allows one Cron Trigger; every 20
# minutes keeps the D1 free tier's daily write budget comfortably headroomed
# (5 outlets x ~30 items x 72 runs/day is well under the 100k-row/day limit).
[triggers]
crons = ["*/20 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "timeline-news"
# Fill in after running `npm run db:create` — wrangler prints the id.
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Uncomment and point at a subdomain once the worker has a stable name, so the
# frontend's VITE_NEWS_API_BASE never has to change across redeploys.
# [[routes]]
# pattern = "news-api.timeline.harithkavish.com/*"
# custom_domain = true
